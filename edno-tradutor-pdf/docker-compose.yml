version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: edno-tradutor-pdf_web_1
      APP_PORT: 8080

  web:
    image: python:3.12-slim
    restart: on-failure
    working_dir: /app
    environment:
      STIRLING_URL: http://stirling-pdf_app_1:8080
      TOKEN_FILE: /segredos/token
      SENHAS_FILE: /segredos/senhas.json
    volumes:
      - ${APP_DATA_DIR}/app.py:/app/app.py:ro
      - ${APP_DATA_DIR}/segredos:/segredos
    command: >-
      sh -c "pip install --no-cache-dir -q flask==3.1.3 requests==2.34.2 gunicorn==23.0.0 &&
      exec gunicorn --bind 0.0.0.0:8080 --workers 1 --threads 2 --timeout 90 app:app"
